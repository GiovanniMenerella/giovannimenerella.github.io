<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giovanni Menerella - Portfolio</title>
  
  <!-- PDF.js per la gestione avanzata e i link cliccabili -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Schermata di selezione iniziale */
    #selection-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 10;
      background-color: #000000;
    }

    .option-btn {
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      cursor: pointer;
      opacity: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Animazioni minimali all'entrata */
    .fade-up {
      animation: fadeInUp 1.2s ease-out forwards;
    }

    .fade-down {
      animation: fadeInDown 1.2s ease-out forwards;
    }

    /* 2 cm corrispondono a circa 75px sui display standard */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      100% {
        opacity: 1;
        transform: translateY(-75px);
      }
    }

    @keyframes fadeInDown {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      100% {
        opacity: 1;
        transform: translateY(75px);
      }
    }

    /* Contenitore PDF */
    #pdf-container {
      display: none;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 10px;
      background-color: #000000;
    }

    .pdf-page-wrapper {
      position: relative;
      margin-bottom: 2mm; /* Spazio di 2mm tra le pagine */
      border-radius: 12px; /* Angoli arrotondati */
      overflow: hidden;
      background-color: #111111;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Layer trasparente per i link interattivi del PDF */
    .annotationLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .annotationLayer a {
      position: absolute;
      font-size: 1em;
      color: transparent;
      cursor: pointer;
    }

    /* Indicatore di caricamento */
    #loading {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #888888;
    }
  </style>
</head>
<body>

  <!-- Menu Selezione -->
  <div id="selection-screen">
    <div class="option-btn fade-up" onclick="loadPDF('mobile.pdf')">versione mobile</div>
    <div class="option-btn fade-down" onclick="loadPDF('desktop.pdf')">versione dekstop</div>
  </div>

  <div id="loading">CARICAMENTO...</div>

  <!-- Viewer PDF -->
  <div id="pdf-container"></div>

  <script>
    // Configurazione worker PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function loadPDF(filename) {
      // Nascondi menu e mostra caricamento
      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      const container = document.getElementById('pdf-container');
      container.style.display = 'block';

      try {
        const pdf = await pdfjsLib.getDocument(filename).promise;
        document.getElementById('loading').style.display = 'none';

        // Renderizza tutte le pagine
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          
          const wrapper = document.createElement('div');
          wrapper.className = 'pdf-page-wrapper';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');

          // Scala di resa ad alta risoluzione
          const viewport = page.getViewport({ scale: 2.0 });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          wrapper.appendChild(canvas);

          // Layer per supportare i link nell'ultima pagina
          const annotationLayerDiv = document.createElement('div');
          annotationLayerDiv.className = 'annotationLayer';
          wrapper.appendChild(annotationLayerDiv);

          container.appendChild(wrapper);

          // Render del canvas
          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          // Render dei link cliccabili
          const annotations = await page.getAnnotations();
          pdfjsLib.renderTextLayer; 
          
          annotations.forEach(annotation => {
            if (annotation.subtype === 'Link' && annotation.url) {
              const link = document.createElement('a');
              link.href = annotation.url;
              link.target = '_blank';
              
              // Calcolo posizione relativa del link
              const rect = viewport.convertToViewportRectangle(annotation.rect);
              const left = Math.min(rect[0], rect[2]);
              const top = Math.min(rect[1], rect[3]);
              const width = Math.abs(rect[0] - rect[2]);
              const height = Math.abs(rect[1] - rect[3]);

              link.style.left = (left / viewport.width * 100) + '%';
              link.style.top = ((viewport.height - top) / viewport.height * 100) + '%';
              link.style.width = (width / viewport.width * 100) + '%';
              link.style.height = (height / viewport.height * 100) + '%';

              annotationLayerDiv.appendChild(link);
            }
          });
        }

        // Animazione di scroll iniziale dal basso verso l'alto
        setTimeout(() => {
          window.scrollTo({ top: 120, behavior: 'instant' });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 100);

      } catch (error) {
        console.error('Errore nel caricamento del PDF:', error);
        alert('Impossibile caricare il file PDF. Assicurati che il nome del file sia corretto.');
      }
    }
  </script>
</body>
</html>
