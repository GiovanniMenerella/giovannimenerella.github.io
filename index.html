<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giovanni Menerella - Fotografia & Visual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Gestione Snap Scroll Nativi stile Apple */
        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
            height: 100%;
            overflow-y: scroll;
        }

        body {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
        }

        /* Blocco dello scroll iniziale durante il video */
        body.intro-active {
            overflow: hidden;
            touch-action: none;
        }

        /* Container Video Intro */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }

        video {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Sezioni full-screen con aggancio preciso */
        section {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Garanzia anti-striscia bianca su browser mobile */
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
        }

        /* PAGINA 1 */
        #page-1 {
            background-color: #000;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            opacity: 0;
            transform: scale(1.04);
            filter: blur(15px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        filter 1.2s ease;
        }

        #page-1.show {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
        }

        .text-block-1 {
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s, 
                        transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
            z-index: 2;
        }

        #page-1.show .text-block-1 {
            opacity: 1;
            transform: translateY(0);
        }

        .text-block-1 h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .text-block-1 p {
            font-size: 1.15rem;
            font-weight: 300;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: #d1d1d1;
        }

        /* PAGINA 2 */
        #page-2 {
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Animazione entrata stile Apple al passaggio */
        .text-block-2 {
            opacity: 0;
            transform: translateY(60px) scale(0.95);
            filter: blur(10px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1.2s ease;
            will-change: transform, opacity, filter;
        }

        #page-2.in-view .text-block-2 {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0px);
        }

        .text-block-2 h2 {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 5px;
            line-height: 1.8;
            text-transform: uppercase;
            color: #1a1a1a;
        }

        /* Responsiveness Mobile */
        @media (max-width: 768px) {
            video {
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
                object-fit: cover;
            }
            #page-1 {
                padding-bottom: 50px;
            }
            .text-block-1 h1 {
                font-size: 1.4rem;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }
            .text-block-1 p {
                font-size: 0.92rem;
                letter-spacing: 5px;
            }
            .text-block-2 h2 {
                font-size: 1.15rem;
                letter-spacing: 3px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body class="intro-active">

    <!-- Video Intro -->
    <div id="video-container">
        <video id="intro-video" autoplay muted playsinline>
            <source src="firma.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Pagina 1 -->
    <section id="page-1">
        <div class="text-block-1">
            <h1>GIOVANNI MENERELLA</h1>
            <p>FOTOGRAFIA &amp; VISUAL</p>
        </div>
    </section>

    <!-- Pagina 2 -->
    <section id="page-2">
        <div class="text-block-2">
            <h2>
                GUIDO L'IMMAGINE<br>
                DALLO SCATTO REALE<br>
                ALLA SUA FORMA FINALE
            </h2>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoContainer = document.getElementById("video-container");
            const video = document.getElementById("intro-video");
            const page1 = document.getElementById("page-1");
            const page2 = document.getElementById("page-2");

            const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const bgImage = isMobile ? '01 mobile.jpg' : '01 desktop.jpg';
            page1.style.backgroundImage = `url('${bgImage}')`;

            function onVideoEnd() {
                videoContainer.style.opacity = '0';
                setTimeout(() => {
                    videoContainer.style.display = 'none';
                    document.body.classList.remove('intro-active');
                    page1.classList.add('show');
                }, 800);
            }

            video.addEventListener("ended", onVideoEnd);
            video.play().catch(error => {
                onVideoEnd();
            });

            // Observer avanzato per azionare l'animazione di Pagina 2 ogni volta che si entra o si ri-entra
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        page2.classList.add('in-view');
                    } else {
                        page2.classList.remove('in-view');
                    }
                });
            }, {
                threshold: 0.35
            });

            observer.observe(page2);
        });
    </script>
</body>
</html>
