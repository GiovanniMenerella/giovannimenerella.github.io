<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giovanni Menerella - Fotografia & Visual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        /* Blocco dello scroll iniziale finché c'è il video */
        body.intro-active {
            overflow: hidden;
        }

        /* Container per il Video (Intro) */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }

        video {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Sezioni del sito */
        section {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* PAGINA 1: Sfondo Nero + Immagine + Nome */
        #page-1 {
            background-color: #000;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            opacity: 0;
            transform: translateY(30px);
            filter: blur(15px);
            transition: opacity 1.2s ease-out, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), filter 1.2s ease-out;
        }

        #page-1.show {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0px);
        }

        /* Testo Pagina 1 */
        .text-block-1 {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-out 0.6s, transform 1s ease-out 0.6s;
            z-index: 2;
        }

        #page-1.show .text-block-1 {
            opacity: 1;
            transform: translateY(0);
        }

        .text-block-1 h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .text-block-1 p {
            font-size: 1.15rem;
            font-weight: 300;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: #d1d1d1;
        }

        /* PAGINA 2: Sfondo Bianco + Frase Centrale */
        #page-2 {
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .text-block-2 {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #page-2.in-view .text-block-2 {
            opacity: 1;
            transform: translateY(0);
        }

        .text-block-2 h2 {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 5px;
            line-height: 1.8;
            text-transform: uppercase;
            color: #1a1a1a;
        }

        /* Adattamenti per Mobile */
        @media (max-width: 768px) {
            video {
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
                object-fit: cover;
            }
            #page-1 {
                padding-bottom: 50px;
            }
            .text-block-1 h1 {
                font-size: 1.4rem;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }
            .text-block-1 p {
                font-size: 0.92rem;
                letter-spacing: 5px;
            }
            .text-block-2 h2 {
                font-size: 1.15rem;
                letter-spacing: 3px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body class="intro-active">

    <!-- Container Video Intro -->
    <div id="video-container">
        <video id="intro-video" autoplay muted playsinline>
            <source src="firma.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>
    </div>

    <!-- PAGINA 1 -->
    <section id="page-1">
        <div class="text-block-1">
            <h1>GIOVANNI MENERELLA</h1>
            <p>FOTOGRAFIA &amp; VISUAL</p>
        </div>
    </section>

    <!-- PAGINA 2 -->
    <section id="page-2">
        <div class="text-block-2">
            <h2>
                GUIDO L'IMMAGINE<br>
                DALLO SCATTO REALE<br>
                ALLA SUA FORMA FINALE
            </h2>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoContainer = document.getElementById("video-container");
            const video = document.getElementById("intro-video");
            const page1 = document.getElementById("page-1");
            const page2 = document.getElementById("page-2");

            // Riconoscimento dispositivo e impostazione immagine di sfondo corretta
            const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const bgImage = isMobile ? '01 mobile.jpg' : '01 desktop.jpg';
            page1.style.backgroundImage = `url('${bgImage}')`;

            // Fine del video iniziale
            function onVideoEnd() {
                videoContainer.style.opacity = '0';
                setTimeout(() => {
                    videoContainer.style.display = 'none';
                    // Sblocca lo scroll della pagina
                    document.body.classList.remove('intro-active');
                    // Attiva l'animazione della prima pagina
                    page1.classList.add('show');
                }, 800);
            }

            video.addEventListener("ended", onVideoEnd);
            video.play().catch(error => {
                console.log("Autoplay non consentito o errore video:", error);
                onVideoEnd();
            });

            // Effetto Parallax ed Entrata della Pagina 2 allo scroll
            window.addEventListener("scroll", function() {
                let scrollY = window.scrollY;
                
                // Effetto parallax differenziato sulla prima pagina (solo se visibile)
                if (page1.classList.contains('show') && scrollY <= window.innerHeight) {
                    page1.style.transform = `translateY(${scrollY * 0.35}px)`;
                    page1.style.opacity = `${1 - (scrollY / window.innerHeight) * 1.2}`;
                }

                // Controllo attivazione animazione pagina 2
                let rect = page2.getBoundingClientRect();
                if (rect.top <= window.innerHeight * 0.75) {
                    page2.classList.add('in-view');
                }
            });
        });
    </script>
</body>
</html>
