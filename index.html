<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Portfolio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* RESET */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #fff;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
}

/* ================= LOADER ================= */

#loader {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.loader-inner {
    text-align: center;
}

/* TESTO */
.name {
    color: #000;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 4px;
}

.role {
    color: rgba(0,0,0,0.7);
    font-size: 1.5rem;
    letter-spacing: 10px;
    margin-top: 28px;
}

/* 🔥 DISSOLVENZA VERSO BIANCO */
#loader.exit .loader-inner {
    animation: textFadeOut 1.2s ease forwards;
}

@keyframes textFadeOut {
    0% {
        opacity: 1;
        filter: blur(0);
    }
    100% {
        opacity: 0;
        filter: blur(10px);
    }
}

/* loader resta bianco, poi sparisce */
#loader.exit {
    animation: loaderFade 0.6s ease forwards;
    animation-delay: 1.2s;
}

@keyframes loaderFade {
    to {
        opacity: 0;
    }
}

/* ================= PDF ================= */

#pdf-container {
    width: 100%;
    padding: 10px 0;
    box-sizing: border-box;
    background: #fff;

    opacity: 0;
    transform: translateY(40px); /* 🔥 partenza più in basso */
}

/* 🔥 ENTRATA CON SCORRIMENTO */
#pdf-container.show {
    animation: pdfEnter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
}

@keyframes pdfEnter {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

/* MOBILE */
@media (max-width:768px){
    .name {
        font-size: 1.8rem;
        letter-spacing: 2px;
    }
    .role {
        margin-top: 20px;
        letter-spacing: 6px;
        font-size: 1.3rem;
    }
}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
    <div class="loader-inner">
        <h1 class="name">GIOVANNI MENERELLA</h1>
        <p class="role">PORTFOLIO</p>
    </div>
</div>

<!-- PDF -->
<div id="pdf-container"></div>

<script>
const url = "Portfolio.pdf";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const container = document.getElementById("pdf-container");

pdfjsLib.getDocument(url).promise.then(pdf => {

    // 🔥 Sequenza cinematografica
    setTimeout(() => {
        document.getElementById("loader").classList.add("exit");
    }, 2000);

    // dopo il bianco → entra il PDF
    setTimeout(() => {
        document.getElementById("pdf-container").classList.add("show");
    }, 3200);

    // rimuovi loader
    setTimeout(() => {
        document.getElementById("loader").remove();
    }, 4000);

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        pdf.getPage(pageNumber).then(page => {
            const scale = window.innerWidth < 768 ? 2.2 : 3;
            const viewport = page.getViewport({ scale });

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            container.appendChild(canvas);

            page.render({
                canvasContext: context,
                viewport: viewport
            });
        });
    }

});
</script>
</body>
</html>
