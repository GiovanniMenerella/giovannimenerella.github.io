<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giovanni Menerella - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* INTRO NERA CON BARRA FLUIDA */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, filter 0.6s ease;
        }

        #loader.exit {
            opacity: 0;
            filter: blur(8px);
            pointer-events: none;
        }

        .loader-bar-container {
            width: 240px;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .loader-bar-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 3px;
        }

        .loader-bar-fill.animate {
            animation: fillProgress 3s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* CONTENITORE SLIDER DESKTOP */
        #pdf-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #000000;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .page-box {
            position: relative;
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* ANIMAZIONE ZOOM E SALITA SULLA PRIMA PAGINA */
        .page-box:first-child .canvas-wrapper {
            opacity: 0;
            transform: translateY(120px) scale(1.08);
            filter: blur(6px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1s ease;
        }

        .page-box:first-child.animate-in .canvas-wrapper {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            border-radius: 4px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.9);
        }

        /* STRATO LINK CLICCABILI (INSTAGRAM, YOUTUBE, ECC.) */
        .annotationLayer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        .annotationLayer a {
            position: absolute;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0);
            cursor: pointer;
        }

        /* PULSANTI DI INTERFACCIA */
        .ui-btn {
            position: fixed;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s, opacity 0.3s;
            user-select: none;
        }

        .ui-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }

        .nav-btn {
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            font-size: 22px;
        }

        .nav-btn:hover {
            transform: translateY(-50%) scale(1.08);
        }

        .nav-btn.disabled {
            opacity: 0.15;
            cursor: default;
            pointer-events: none;
        }

        #prev-btn { left: 25px; }
        #next-btn { right: 25px; }

        #fullscreen-btn {
            top: 25px;
            right: 25px;
            width: 44px;
            height: 44px;
            font-size: 18px;
        }

        #page-counter {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 1000;
            pointer-events: none;
        }

        /* ADATTAMENTO SMARTPHONE */
        @media (max-width: 768px) {
            body, html {
                overflow-x: hidden;
                overflow-y: auto;
            }

            #pdf-container {
                display: block;
                width: 100%;
                height: auto;
                transform: none !important;
            }

            .page-box {
                width: 100%;
                height: auto;
                padding: 0;
                margin-bottom: 10px;
            }

            .canvas-wrapper {
                width: 100% !important;
                height: auto !important;
            }

            canvas {
                width: 100% !important;
                height: auto !important;
            }

            .ui-btn, #page-counter {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Intro Schermata Nera con Barra 5px (3s lineare) -->
    <div id="loader">
        <div class="loader-bar-container">
            <div id="loader-bar-fill" class="loader-bar-fill"></div>
        </div>
    </div>

    <!-- Controlli Desktop -->
    <button id="fullscreen-btn" class="ui-btn" title="Schermo Intero">&#x26F6;</button>
    <button id="prev-btn" class="ui-btn nav-btn" aria-label="Pagina precedente">&#10094;</button>
    <button id="next-btn" class="ui-btn nav-btn" aria-label="Pagina successiva">&#10095;</button>
    <div id="page-counter">1 / --</div>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");
        const loader = document.getElementById("loader");
        const loaderBarFill = document.getElementById("loader-bar-fill");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const fullscreenBtn = document.getElementById("fullscreen-btn");
        const pageCounter = document.getElementById("page-counter");

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const pdfUrl = isMobile ? "mobile.pdf" : "desktop.pdf";

        let currentPage = 1;
        let totalPages = 0;
        let loadedPdfDocument = null;

        // Avvia l'animazione della barra (3 secondi esatti)
        loaderBarFill.classList.add("animate");

        function updateNavigation() {
            if (isMobile) return;
            container.style.transform = `translateX(-${(currentPage - 1) * 100}vw)`;
            pageCounter.textContent = `${currentPage} / ${totalPages}`;
            prevBtn.classList.toggle("disabled", currentPage === 1);
            nextBtn.classList.toggle("disabled", currentPage === totalPages);
        }

        async function renderPDF() {
            if (!loadedPdfDocument) return;

            container.innerHTML = "";
            const dpr = window.devicePixelRatio || 1;

            for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
                const pageBox = document.createElement("div");
                pageBox.className = "page-box";
                pageBox.id = "page-box-" + pageNumber;

                const wrapper = document.createElement("div");
                wrapper.className = "canvas-wrapper";
                wrapper.id = "wrapper-" + pageNumber;

                pageBox.appendChild(wrapper);
                container.appendChild(pageBox);
            }

            for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
                const page = await loadedPdfDocument.getPage(pageNumber);
                const unscaledViewport = page.getViewport({ scale: 1.0 });

                let displayWidth, displayHeight;

                if (isMobile) {
                    displayWidth = window.innerWidth;
                    displayHeight = (unscaledViewport.height / unscaledViewport.width) * displayWidth;
                } else {
                    const maxW = window.innerWidth;
                    const maxH = window.innerHeight;
                    const fitScale = Math.min(maxW / unscaledViewport.width, maxH / unscaledViewport.height);

                    displayWidth = Math.floor(unscaledViewport.width * fitScale);
                    displayHeight = Math.floor(unscaledViewport.height * fitScale);
                }

                const wrapper = document.getElementById("wrapper-" + pageNumber);
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");

                // Nitidezza massima: rendering al triplo della risoluzione display
                const renderScale = (displayWidth / unscaledViewport.width) * dpr * 3;
                const renderViewport = page.getViewport({ scale: renderScale });

                canvas.width = renderViewport.width;
                canvas.height = renderViewport.height;

                canvas.style.width = displayWidth + "px";
                canvas.style.height = displayHeight + "px";

                wrapper.style.width = displayWidth + "px";
                wrapper.style.height = displayHeight + "px";

                wrapper.appendChild(canvas);

                await page.render({
                    canvasContext: context,
                    viewport: renderViewport
                }).promise;

                // Gestione e posizionamento corretto dei link
                const annotations = await page.getAnnotations();
                if (annotations.length > 0) {
                    const layer = document.createElement("div");
                    layer.className = "annotationLayer";
                    wrapper.appendChild(layer);

                    annotations.forEach(annotation => {
                        if (annotation.subtype === 'Link' && annotation.url) {
                            const link = document.createElement('a');
                            link.href = annotation.url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';

                            const rect = unscaledViewport.convertToViewportRectangle(annotation.rect);
                            const left = Math.min(rect[0], rect[2]);
                            const top = Math.min(rect[1], rect[3]);
                            const width = Math.abs(rect[0] - rect[2]);
                            const height = Math.abs(rect[1] - rect[3]);

                            link.style.left = (left / unscaledViewport.width * 100) + '%';
                            link.style.top = ((unscaledViewport.height - top) / unscaledViewport.height * 100) + '%';
                            link.style.width = (width / unscaledViewport.width * 100) + '%';
                            link.style.height = (height / unscaledViewport.height * 100) + '%';

                            layer.appendChild(link);
                        }
                    });
                }
            }

            updateNavigation();
        }

        // Caricamento del file PDF
        const pdfPromise = pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
            loadedPdfDocument = pdf;
            totalPages = pdf.numPages;
            pageCounter.textContent = `1 / ${totalPages}`;
            return renderPDF();
        });

        // Attende la fine dell'animazione di 3s per aprire il PDF
        const animationPromise = new Promise(resolve => setTimeout(resolve, 3000));

        Promise.all([pdfPromise, animationPromise]).then(() => {
            loader.classList.add("exit");
            const firstBox = document.getElementById("page-box-1");
            setTimeout(() => {
                if (firstBox) firstBox.classList.add("animate-in");
            }, 100);
            setTimeout(() => loader.remove(), 600);
        }).catch(err => {
            console.error("Errore nel caricamento del PDF: ", err);
        });

        // NAVIGAZIONE
        function goToNextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updateNavigation();
            }
        }

        function goToPrevPage() {
            if (currentPage > 1) {
                currentPage--;
                updateNavigation();
            }
        }

        nextBtn.addEventListener("click", goToNextPage);
        prevBtn.addEventListener("click", goToPrevPage);

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key === " ") {
                goToNextPage();
            } else if (e.key === "ArrowLeft") {
                goToPrevPage();
            }
        });

        let isScrolling = false;
        window.addEventListener("wheel", (e) => {
            if (isMobile || isScrolling) return;

            if (e.deltaY > 0) {
                goToNextPage();
            } else if (e.deltaY < 0) {
                goToPrevPage();
            }

            isScrolling = true;
            setTimeout(() => { isScrolling = false; }, 400);
        });

        // FULLSCREEN RE-RENDER PER ADATTARE LE DIMENSIONI ALLA SCHERMATA
        fullscreenBtn.addEventListener("click", () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Errore Fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        window.addEventListener("resize", () => {
            if (!isMobile && loadedPdfDocument) {
                renderPDF();
            }
        });
    </script>
</body>
</html>
