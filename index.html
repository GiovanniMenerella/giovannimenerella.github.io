<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Portfolio - Giovanni Menerella</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* RESET */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #000; 
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= LOADER ================= */
        #loader {
            position: fixed;
            inset: 0;
            background: #fff; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loader-inner {
            text-align: center;
        }

        .name {
            color: #000; 
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 4px; 
            opacity: 0;
            transform: translateY(12px);
            filter: blur(6px);
            animation: nameIn 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .role {
            color: rgba(0, 0, 0, 0.6); 
            font-size: 1.5rem;
            letter-spacing: 10px; 
            margin-top: 28px; 
            opacity: 0;
            transform: translateY(10px);
            animation: roleIn 1.8s ease forwards;
            animation-delay: 1.2s;
        }

        @keyframes nameIn {
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes roleIn {
            to { opacity: 1; transform: translateY(0); letter-spacing: 10px; }
        }

        /* USCITA LOADER */
        #loader.exit {
            animation: zoomOut 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            pointer-events: none;
        }

        @keyframes zoomOut {
            0% { transform: scale(1); opacity: 1; filter: blur(0); }
            100% { transform: scale(1.12); opacity: 0; filter: blur(10px); }
        }

        /* ================= PDF CONTAINER (CON EFFETTI RIPRISTINATI) ================= */
        #pdf-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            
            /* Stato iniziale per l'effetto zoom e scorrimento */
            opacity: 0;
            transform: scale(1.04) translateY(30px);
            transition: all 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            visibility: hidden;
        }

        #pdf-container.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            visibility: visible;
        }

        canvas {
            max-width: 100%;
            height: auto !important;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            background: transparent;
        }

        @media (max-width:768px){
            .name { font-size: 1.8rem; letter-spacing: 2px; }
            .role { font-size: 1.3rem; letter-spacing: 6px; margin-top: 20px; }
            #pdf-container { padding: 5px; }
            canvas { margin-bottom: 10px; }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-inner">
            <h1 class="name">GIOVANNI MENERELLA</h1>
            <p class="role">PORTFOLIO</p>
        </div>
    </div>

    <div id="pdf-container"></div>

    <script>
        const url = "Portfolio.pdf";
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");

        async function init() {
            // Timer forzato di 4 secondi
            const timerPromise = new Promise(resolve => setTimeout(resolve, 4000));
            
            // Caricamento PDF
            const pdfPromise = pdfjsLib.getDocument(url).promise;

            try {
                // Aspetta entrambi
                const [pdf] = await Promise.all([pdfPromise, timerPromise]);

                // Attiva animazioni di uscita loader ed entrata PDF
                document.getElementById("loader").classList.add("exit");
                container.classList.add("show");

                // Pulizia del loader dopo l'animazione
                setTimeout(() => {
                    const ldr = document.getElementById("loader");
                    if(ldr) ldr.remove();
                }, 1500);

                // Rendering sequenziale (Ottimo per file da 19MB)
                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    const page = await pdf.getPage(pageNumber);
                    
                    const isMobile = window.innerWidth < 768;
                    const scale = isMobile ? 1.6 : 2.5; 
                    
                    const viewport = page.getViewport({ scale });
                    const canvas = document.createElement("canvas");
                    const context = canvas.getContext("2d");

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    page.cleanup();
                }
            } catch (error) {
                console.error("Errore:", error);
                document.getElementById("loader").remove();
            }
        }

        init();
    </script>
</body>
</html>
