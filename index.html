<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Portfolio | Giovanni Menerella</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* RESET */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #000; /* Sfondo finale nero per il PDF */
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= LOADER (INVERTITO) ================= */
        #loader {
            position: fixed;
            inset: 0;
            background: #fff; /* SFONDO BIANCO */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loader-inner {
            text-align: center;
        }

        .name {
            color: #000; /* TESTO NERO */
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 4px; 
            opacity: 0;
            transform: translateY(12px);
            filter: blur(6px);
            animation: nameIn 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .role {
            color: rgba(0, 0, 0, 0.6); /* TESTO GRIGIO SCURO/NERO */
            font-size: 1.5rem;
            letter-spacing: 10px; 
            margin-top: 28px; 
            opacity: 0;
            transform: translateY(10px);
            animation: roleIn 1.8s ease forwards;
            animation-delay: 1.5s;
        }

        @keyframes nameIn {
            0% { opacity: 0; transform: translateY(12px); filter: blur(6px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes roleIn {
            0% { opacity: 0; transform: translateY(10px); letter-spacing: 0px; }
            100% { opacity: 1; letter-spacing: 10px; opacity: 1; transform: translateY(0); }
        }

        #loader.exit {
            animation: zoomOut 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            pointer-events: none;
        }

        @keyframes zoomOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.1); filter: blur(10px); opacity: 0; }
        }

        /* ================= PDF CONTAINER ================= */
        #pdf-container {
            width: 100%;
            background: #000; /* Sfondo PDF nero */
            padding: 10px 0;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #pdf-container.show {
            opacity: 1;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            margin: 0 auto 20px auto;
            background: #000;
        }

        @media (max-width:768px){
            .name { font-size: 1.6rem; letter-spacing: 2px; }
            .role { margin-top: 15px; letter-spacing: 5px; font-size: 1.1rem; }
        }
    </style>
</head>

<body>

<div id="loader">
    <div class="loader-inner">
        <h1 class="name">GIOVANNI MENERELLA</h1>
        <p class="role">PORTFOLIO</p>
    </div>
</div>

<div id="pdf-container"></div>

<script>
const url = "Portfolio.pdf";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const container = document.getElementById("pdf-container");

async function renderPDF() {
    try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        
        // Rimuoviamo il loader non appena il PDF è caricato e la prima pagina è pronta
        const totalPages = pdf.numPages;

        for (let i = 1; i <= totalPages; i++) {
            const page = await pdf.getPage(i);
            
            // OTTIMIZZAZIONE: Scala ridotta per mobile per risparmiare RAM
            const isMobile = window.innerWidth < 768;
            const scale = isMobile ? 1.5 : 2.5; 
            
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.height = viewport.height;
            canvas.width = viewport.width;
            container.appendChild(canvas);

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            // Al termine del rendering della PRIMA pagina, iniziamo a mostrare il contenuto
            if (i === 1) {
                setTimeout(() => {
                    document.getElementById("loader").classList.add("exit");
                    container.classList.add("show");
                }, 1000);
            }
        }
    } catch (error) {
        console.error("Errore nel caricamento PDF:", error);
    }
}

renderPDF();
</script>
</body>
</html>
