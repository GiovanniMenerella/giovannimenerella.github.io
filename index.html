<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giovanni Menerella - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= SELEZIONE / INTRO ================= */
        #selection-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), filter 1s ease;
        }

        #selection-screen.exit {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        .option-btn {
            color: #000000;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
        }

        .fade-up {
            animation: fadeAndMoveUp 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .fade-down {
            animation: fadeAndMoveDown 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            animation-delay: 0.2s;
        }

        @keyframes fadeAndMoveUp {
            0% {
                opacity: 0;
                transform: translateY(0);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(-38px);
                filter: blur(0);
            }
        }

        @keyframes fadeAndMoveDown {
            0% {
                opacity: 0;
                transform: translateY(0);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(38px);
                filter: blur(0);
            }
        }

        /* ================= CONTENITORE PDF ================= */
        #pdf-container {
            display: block;
            width: 100%;
            margin: 0;
            padding: 10px 0;
            box-sizing: border-box;
            background: #000;
        }

        .page-box {
            position: relative;
            width: 100%;
            margin-bottom: 2mm;
            opacity: 1;
        }

        /* EFFETTO ACCENTUATO SULLA PRIMA PAGINA */
        .page-box:first-child {
            opacity: 0;
            /* Parte più in basso (120px) e più ingrandita (1.10) con una leggera sfocatura iniziale */
            transform: translateY(120px) scale(1.10);
            filter: blur(4px);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.4s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1.2s ease;
        }

        .page-box:first-child.animate-in {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            background: transparent;
        }

        .annotationLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .annotationLayer a {
            position: absolute;
            pointer-events: auto;
            color: transparent;
        }

        @media (max-width: 768px) {
            .option-btn {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
            #pdf-container {
                padding: 5px;
            }
        }
    </style>
</head>

<body>

    <div id="selection-screen">
        <div class="option-btn fade-up" onclick="loadPortfolio('mobile.pdf')">VERSIONE MOBILE</div>
        <div class="option-btn fade-down" onclick="loadPortfolio('desktop.pdf')">VERSIONE DESKTOP</div>
    </div>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");
        const selectionScreen = document.getElementById("selection-screen");

        function loadPortfolio(url) {
            selectionScreen.classList.add("exit");

            pdfjsLib.getDocument(url).promise.then(async pdf => {
                
                // 1. Allocazione contenitori
                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    const pageBox = document.createElement("div");
                    pageBox.className = "page-box";
                    pageBox.id = "page-box-" + pageNumber;
                    container.appendChild(pageBox);
                }

                // 2. Rendering prima pagina
                const firstPage = await pdf.getPage(1);
                const scale = 1.8;
                const viewport = firstPage.getViewport({ scale });
                
                const firstBox = document.getElementById("page-box-1");
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                firstBox.appendChild(canvas);
                
                await firstPage.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                // Rimozione schermata bianca
                setTimeout(() => {
                    selectionScreen.remove();
                }, 800);

                // 3. Lancio dell'animazione marcata di salita e zoom
                setTimeout(() => {
                    firstBox.classList.add("animate-in");
                }, 50);

                // 4. Caricamento in sequenza delle altre pagine
                for (let pageNumber = 2; pageNumber <= pdf.numPages; pageNumber++) {
                    const page = await pdf.getPage(pageNumber);
                    const pageBox = document.getElementById("page-box-" + pageNumber);
                    const pageCanvas = document.createElement("canvas");
                    const pageContext = pageCanvas.getContext("2d");
                    
                    pageCanvas.height = page.getViewport({ scale }).height;
                    pageCanvas.width = page.getViewport({ scale }).width;
                    pageBox.appendChild(pageCanvas);
                    
                    await page.render({
                        canvasContext: pageContext,
                        viewport: page.getViewport({ scale })
                    }).promise;

                    // Gestione link
                    const annotations = await page.getAnnotations();
                    if (annotations.length > 0) {
                        const layer = document.createElement("div");
                        layer.className = "annotationLayer";
                        pageBox.appendChild(layer);

                        annotations.forEach(annotation => {
                            if (annotation.subtype === 'Link' && annotation.url) {
                                const link = document.createElement('a');
                                link.href = annotation.url;
                                link.target = '_blank';
                                link.rel = 'noopener noreferrer';

                                const rect = page.getViewport({ scale }).convertToViewportRectangle(annotation.rect);
                                const left = Math.min(rect[0], rect[2]);
                                const top = Math.min(rect[1], rect[3]);
                                const width = Math.abs(rect[0] - rect[2]);
                                const height = Math.abs(rect[1] - rect[3]);

                                link.style.left = (left / page.getViewport({ scale }).width * 100) + '%';
                                link.style.top = ((page.getViewport({ scale }).height - top) / page.getViewport({ scale }).height * 100) + '%';
                                link.style.width = (width / page.getViewport({ scale }).width * 100) + '%';
                                link.style.height = (height / page.getViewport({ scale }).height * 100) + '%';

                                layer.appendChild(link);
                            }
                        });
                    }
                }
            }).catch(err => {
                console.error("Errore nel caricamento del PDF: ", err);
            });
        }
    </script>
</body>
</html>
