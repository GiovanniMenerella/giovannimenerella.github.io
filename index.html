<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giovanni Menerella - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= SELEZIONE / INTRO ================= */
        #selection-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), filter 1.2s ease;
        }

        #selection-screen.exit {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        .option-btn {
            color: #000000;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
        }

        .fade-up {
            animation: fadeAndMoveUp 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .fade-down {
            animation: fadeAndMoveDown 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            animation-delay: 0.2s;
        }

        @keyframes fadeAndMoveUp {
            0% {
                opacity: 0;
                transform: translateY(0);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(-38px);
                filter: blur(0);
            }
        }

        @keyframes fadeAndMoveDown {
            0% {
                opacity: 0;
                transform: translateY(0);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(38px);
                filter: blur(0);
            }
        }

        #loading-text {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000000;
            font-size: 0.9rem;
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
            z-index: 10000;
        }

        /* ================= CONTENITORE PDF ================= */
        #pdf-container {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 5px;
            background: #000000;
            opacity: 0;
            transform: scale(1.04);
            transition: opacity 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        #pdf-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .pdf-page-wrapper {
            position: relative;
            margin-bottom: 2mm;
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .annotationLayer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .annotationLayer a {
            position: absolute;
            pointer-events: auto;
            color: transparent;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .option-btn {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
            #pdf-container {
                padding: 5px 0;
            }
        }
    </style>
</head>

<body>

    <div id="selection-screen">
        <div class="option-btn fade-up" onclick="loadPortfolio('mobile.pdf')">VERSIONE MOBILE</div>
        <div class="option-btn fade-down" onclick="loadPortfolio('desktop.pdf')">VERSIONE DESKTOP</div>
    </div>

    <div id="loading-text">CARICAMENTO...</div>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        function loadPortfolio(filename) {
            const selectionScreen = document.getElementById("selection-screen");
            const loadingText = document.getElementById("loading-text");
            const container = document.getElementById("pdf-container");

            selectionScreen.querySelectorAll('.option-btn').forEach(btn => btn.style.display = 'none');
            loadingText.style.display = "block";

            pdfjsLib.getDocument(filename).promise.then(pdf => {
                container.style.display = "block";

                // Mostra subito il contenitore ed esegui la transizione
                setTimeout(() => {
                    selectionScreen.classList.add("exit");
                    container.classList.add("show");
                }, 200);

                setTimeout(() => {
                    selectionScreen.style.display = "none";
                    loadingText.style.display = "none";
                }, 1200);

                // Renderizzazione asincrona per evitare blocchi o crash
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    pdf.getPage(pageNum).then(page => {
                        const wrapper = document.createElement("div");
                        wrapper.className = "pdf-page-wrapper";

                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");

                        // Scala ottimizzata: 1.5 su mobile, 1.8 su desktop
                        const scale = window.innerWidth < 768 ? 1.5 : 1.8;
                        const viewport = page.getViewport({ scale });

                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        wrapper.appendChild(canvas);

                        const annotationLayerDiv = document.createElement("div");
                        annotationLayerDiv.className = "annotationLayer";
                        wrapper.appendChild(annotationLayerDiv);

                        container.appendChild(wrapper);

                        page.render({
                            canvasContext: context,
                            viewport: viewport
                        });

                        // Gestione link interattivi nell'ultima pagina
                        page.getAnnotations().then(annotations => {
                            annotations.forEach(annotation => {
                                if (annotation.subtype === 'Link' && annotation.url) {
                                    const link = document.createElement('a');
                                    link.href = annotation.url;
                                    link.target = '_blank';
                                    link.rel = 'noopener noreferrer';

                                    const rect = viewport.convertToViewportRectangle(annotation.rect);
                                    const left = Math.min(rect[0], rect[2]);
                                    const top = Math.min(rect[1], rect[3]);
                                    const width = Math.abs(rect[0] - rect[2]);
                                    const height = Math.abs(rect[1] - rect[3]);

                                    link.style.left = (left / viewport.width * 100) + '%';
                                    link.style.top = ((viewport.height - top) / viewport.height * 100) + '%';
                                    link.style.width = (width / viewport.width * 100) + '%';
                                    link.style.height = (height / viewport.height * 100) + '%';

                                    annotationLayerDiv.appendChild(link);
                                }
                            });
                        });
                    });
                }

            }).catch(err => {
                console.error("Errore nel caricamento del PDF: ", err);
                alert("Impossibile caricare il file. Assicurati che i file si chiamino 'mobile.pdf' e 'desktop.pdf'.");
                loadingText.style.display = "none";
                selectionScreen.querySelectorAll('.option-btn').forEach(btn => btn.style.display = 'block');
            });
        }
    </script>
</body>
</html>
