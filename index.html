<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giovanni Menerella - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= SELEZIONE / INTRO ================= */
        #selection-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), filter 1.2s ease;
        }

        #selection-screen.exit {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        .option-btn {
            color: #000000;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
        }

        .fade-up {
            animation: fadeAndMoveUp 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .fade-down {
            animation: fadeAndMoveDown 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            animation-delay: 0.2s;
        }

        @keyframes fadeAndMoveUp {
            0% {
                opacity: 0;
                transform: translateY(0);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(-38px);
                filter: blur(0);
            }
        }

        @keyframes fadeAndMoveDown {
            0% {
                opacity: 0;
                transform: translateY(0);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(38px);
                filter: blur(0);
            }
        }

        /* ================= CONTENITORE PDF ================= */
        #pdf-container {
            display: block;
            width: 100%;
            margin: 0;
            padding: 10px 0;
            box-sizing: border-box;
            opacity: 0;
            transform: scale(1.04);
            transition: all 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            background: #000;
        }

        #pdf-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .page-box {
            position: relative;
            width: 100%;
            margin-bottom: 2mm;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            background: transparent;
        }

        .annotationLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .annotationLayer a {
            position: absolute;
            pointer-events: auto;
            color: transparent;
        }

        @media (max-width: 768px) {
            .option-btn {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
            #pdf-container {
                padding: 5px;
            }
            .page-box {
                margin-bottom: 2mm;
            }
        }
    </style>
</head>

<body>

    <div id="selection-screen">
        <div class="option-btn fade-up" onclick="loadPortfolio('mobile.pdf')">VERSIONE MOBILE</div>
        <div class="option-btn fade-down" onclick="loadPortfolio('desktop.pdf')">VERSIONE DESKTOP</div>
    </div>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");
        const selectionScreen = document.getElementById("selection-screen");

        function loadPortfolio(url) {
            // Animazione di uscita loader ed entrata PDF (stessi tempi del tuo file originale)
            selectionScreen.classList.add("exit");
            container.classList.add("show");

            setTimeout(() => {
                selectionScreen.remove();
            }, 1400);

            // Caricamento PDF originale esatto
            pdfjsLib.getDocument(url).promise.then(async pdf => {
                
                // Creiamo prima i contenitori per mantenere l'ordine esatto delle pagine
                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    const pageBox = document.createElement("div");
                    pageBox.className = "page-box";
                    pageBox.id = "page-box-" + pageNumber;
                    container.appendChild(pageBox);
                }

                // Renderizziamo pagina per pagina in sequenza corretta
                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    const page = await pdf.getPage(pageNumber);
                    const scale = 1.8; 
                    const viewport = page.getViewport({ scale });
                    
                    const pageBox = document.getElementById("page-box-" + pageNumber);
                    const canvas = document.createElement("canvas");
                    const context = canvas.getContext("2d");
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    pageBox.appendChild(canvas);
                    
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // Aggiunta link solo se presenti nella pagina
                    const annotations = await page.getAnnotations();
                    if (annotations.length > 0) {
                        const layer = document.createElement("div");
                        layer.className = "annotationLayer";
                        pageBox.appendChild(layer);

                        annotations.forEach(annotation => {
                            if (annotation.subtype === 'Link' && annotation.url) {
                                const link = document.createElement('a');
                                link.href = annotation.url;
                                link.target = '_blank';
                                link.rel = 'noopener noreferrer';

                                const rect = viewport.convertToViewportRectangle(annotation.rect);
                                const left = Math.min(rect[0], rect[2]);
                                const top = Math.min(rect[1], rect[3]);
                                const width = Math.abs(rect[0] - rect[2]);
                                const height = Math.abs(rect[1] - rect[3]);

                                link.style.left = (left / viewport.width * 100) + '%';
                                link.style.top = ((viewport.height - top) / viewport.height * 100) + '%';
                                link.style.width = (width / viewport.width * 100) + '%';
                                link.style.height = (height / viewport.height * 100) + '%';

                                layer.appendChild(link);
                            }
                        });
                    }
                }
            }).catch(err => {
                console.error("Errore nel caricamento del PDF: ", err);
            });
        }
    </script>
</body>
</html>
