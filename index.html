<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giovanni Menerella - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* SCHERMATA INTRO BIANCA CON NOME */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), filter 1s ease;
        }

        #loader.exit {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        .loader-inner {
            text-align: center;
        }

        .name {
            color: #000000;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0;
            transform: translateY(12px);
            filter: blur(6px);
            animation: nameIn 1.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .role {
            color: rgba(0, 0, 0, 0.6);
            font-size: 1.2rem;
            letter-spacing: 8px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px);
            animation: roleIn 1.5s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes nameIn {
            0% { opacity: 0; transform: translateY(12px); filter: blur(6px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes roleIn {
            0% { opacity: 0; transform: translateY(10px); letter-spacing: 2px; }
            100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
        }

        /* CONTENITORE PDF */
        #pdf-container {
            display: block;
            width: 100%;
            margin: 0;
            padding: 10px 0;
            box-sizing: border-box;
            background: #000;
        }

        .page-box {
            position: relative;
            width: 100%;
            margin-bottom: 2mm;
            opacity: 1;
        }

        /* EFFETTO ENTRATA PRIMA PAGINA */
        .page-box:first-child {
            opacity: 0;
            transform: translateY(120px) scale(1.10);
            filter: blur(4px);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.4s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1.2s ease;
        }

        .page-box:first-child.animate-in {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            background: transparent;
        }

        .annotationLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .annotationLayer a {
            position: absolute;
            pointer-events: auto;
            color: transparent;
        }

        @media (max-width: 768px) {
            .name { font-size: 1.6rem; letter-spacing: 2px; }
            .role { font-size: 1rem; letter-spacing: 4px; }
            #pdf-container { padding: 5px; }
        }
    </style>
</head>

<body>

    <!-- Intro Schermata Bianca -->
    <div id="loader">
        <div class="loader-inner">
            <h1 class="name">GIOVANNI MENERELLA</h1>
            <p class="role">PORTFOLIO</p>
        </div>
    </div>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");
        const loader = document.getElementById("loader");

        // 1. RILEVAMENTO AUTOMATICO DISPOSITIVO (Mobile vs Desktop)
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const pdfUrl = isMobile ? "mobile.pdf" : "desktop.pdf";

        // Scala ottimizzata: 1.2 su mobile per evitare il crash di memoria RAM, 1.8 su desktop
        const scale = isMobile ? 1.2 : 1.8;

        pdfjsLib.getDocument(pdfUrl).promise.then(async pdf => {
            
            // Pre-allocazione contenitori pagine
            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                const pageBox = document.createElement("div");
                pageBox.className = "page-box";
                pageBox.id = "page-box-" + pageNumber;
                container.appendChild(pageBox);
            }

            // Rendering prima pagina
            const firstPage = await pdf.getPage(1);
            const viewport = firstPage.getViewport({ scale });
            
            const firstBox = document.getElementById("page-box-1");
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            firstBox.appendChild(canvas);
            
            await firstPage.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            // Rimuovi la schermata intro bianca
            setTimeout(() => {
                loader.classList.add("exit");
                setTimeout(() => loader.remove(), 1000);
            }, 1200);

            // Avvia effetto zoom/salita sulla prima pagina
            setTimeout(() => {
                firstBox.classList.add("animate-in");
            }, 300);

            // Rendering sequenziale pagine successive
            for (let pageNumber = 2; pageNumber <= pdf.numPages; pageNumber++) {
                const page = await pdf.getPage(pageNumber);
                const pageViewport = page.getViewport({ scale });
                const pageBox = document.getElementById("page-box-" + pageNumber);
                const pageCanvas = document.createElement("canvas");
                const pageContext = pageCanvas.getContext("2d");
                
                pageCanvas.height = pageViewport.height;
                pageCanvas.width = pageViewport.width;
                pageBox.appendChild(pageCanvas);
                
                await page.render({
                    canvasContext: pageContext,
                    viewport: pageViewport
                }).promise;

                // Gestione link nell'ultima pagina
                const annotations = await page.getAnnotations();
                if (annotations.length > 0) {
                    const layer = document.createElement("div");
                    layer.className = "annotationLayer";
                    pageBox.appendChild(layer);

                    annotations.forEach(annotation => {
                        if (annotation.subtype === 'Link' && annotation.url) {
                            const link = document.createElement('a');
                            link.href = annotation.url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';

                            const rect = pageViewport.convertToViewportRectangle(annotation.rect);
                            const left = Math.min(rect[0], rect[2]);
                            const top = Math.min(rect[1], rect[3]);
                            const width = Math.abs(rect[0] - rect[2]);
                            const height = Math.abs(rect[1] - rect[3]);

                            link.style.left = (left / pageViewport.width * 100) + '%';
                            link.style.top = ((pageViewport.height - top) / pageViewport.height * 100) + '%';
                            link.style.width = (width / pageViewport.width * 100) + '%';
                            link.style.height = (height / pageViewport.height * 100) + '%';

                            layer.appendChild(link);
                        }
                    });
                }
            }
        }).catch(err => {
            console.error("Errore nel caricamento del PDF: ", err);
        });
    </script>
</body>
</html>
