<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* RESET & TEMA BIANCO */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #ffffff; /* Sfondo Bianco */
            color: #000000;      /* Testo Nero */
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= LOADER ================= */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loader-inner {
            text-align: center;
        }

        .name {
            color: #000;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 4px; 
            opacity: 0;
            transform: translateY(12px);
            filter: blur(6px);
            animation: nameIn 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .role {
            color: rgba(0, 0, 0, 0.5); /* Grigio scuro per contrasto */
            font-size: 1.5rem;
            letter-spacing: 10px; 
            margin-top: 28px; 
            opacity: 0;
            transform: translateY(10px);
            animation: roleIn 1.8s ease forwards;
            animation-delay: 1.5s;
        }

        @keyframes nameIn {
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes roleIn {
            100% { opacity: 1; transform: translateY(0); letter-spacing: 10px; }
        }

        #loader.exit {
            animation: zoomOut 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            pointer-events: none;
        }

        @keyframes zoomOut {
            100% { transform: scale(1.1); filter: blur(10px); opacity: 0; }
        }

        /* ================= PDF CONTAINER ================= */
        #pdf-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 0;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #pdf-container.show {
            opacity: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto 30px auto;
            border-radius: 4px;
            /* Ombra più leggera per sfondo bianco */
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            background: #f9f9f9;
            /* Ottimizzazione rendering */
            content-visibility: auto;
            contain-intrinsic-size: 1px 800px;
        }

        /* MOBILE */
        @media (max-width:768px){
            .name { font-size: 1.6rem; letter-spacing: 2px; }
            .role { margin-top: 15px; letter-spacing: 5px; font-size: 1.1rem; }
            #pdf-container { padding: 10px; }
            canvas { margin-bottom: 15px; }
        }
    </style>
</head>

<body>

<div id="loader">
    <div class="loader-inner">
        <h1 class="name">GIOVANNI MENERELLA</h1>
        <p class="role">PORTFOLIO</p>
    </div>
</div>

<div id="pdf-container"></div>

<script>
/** * CONFIGURAZIONE 
 */
const url = "Portfolio.pdf"; 
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const container = document.getElementById("pdf-container");
let pdfDoc = null;

/**
 * FUNZIONE DI RENDERING SINGOLA PAGINA
 */
async function renderPage(num, canvas) {
    // Evita di ri-renderizzare se la pagina è già pronta
    if (canvas.dataset.loaded === "true") return;

    const page = await pdfDoc.getPage(num);
    const isMobile = window.innerWidth < 768;
    
    // Scale 1.5 per mobile (leggero), 2.5 per desktop (nitido)
    const scale = isMobile ? 1.5 : 2.5; 
    const viewport = page.getViewport({ scale });
    
    const context = canvas.getContext("2d");
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    await page.render({
        canvasContext: context,
        viewport: viewport
    }).promise;

    canvas.dataset.loaded = "true";
}

/**
 * INIZIALIZZAZIONE DOCUMENTO
 */
pdfjsLib.getDocument(url).promise.then(async (pdf) => {
    pdfDoc = pdf;
    
    // 1. Creiamo i "gusci" (canvas) per tutte le 33 pagine subito
    // Questo permette lo scroll fluido anche se le immagini non sono ancora cariche
    for (let i = 1; i <= pdf.numPages; i++) {
        const canvas = document.createElement("canvas");
        canvas.dataset.pageNumber = i;
        container.appendChild(canvas);

        // 2. Setup IntersectionObserver: carica la pagina quando entra nel mirino
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const pageNum = parseInt(entry.target.dataset.pageNumber);
                    renderPage(pageNum, entry.target);
                    // Una volta caricata, smettiamo di osservarla per risparmiare CPU
                    observer.unobserve(entry.target);
                }
            });
        }, { 
            rootMargin: "600px" // Inizia a caricare la pagina 600px prima che appaia
        });

        observer.observe(canvas);
    }

    // 3. Carichiamo la PRIMA pagina immediatamente per sbloccare il loader
    const firstCanvas = container.querySelector('canvas[data-page-number="1"]');
    await renderPage(1, firstCanvas);

    // 4. Nascondiamo il loader con un piccolo delay per eleganza
    setTimeout(() => {
        document.getElementById("loader").classList.add("exit");
        document.getElementById("pdf-container").classList.add("show");
    }, 500);

    // Rimuoviamo il loader dal DOM dopo l'animazione
    setTimeout(() => {
        document.getElementById("loader")?.remove();
    }, 2000);

}).catch(err => {
    console.error("Errore PDF:", err);
    document.querySelector(".name").innerText = "ERRORE CARICAMENTO";
});
</script>

</body>
</html>
