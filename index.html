<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giovanni Menerella - Fotografia & Visual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
        }

        /* Container per il Video */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background-color: #000;
            transition: opacity 0.8s ease-out;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Container per il Contenuto (Immagine + Testo) */
        #main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: translateY(30px);
            filter: blur(15px);
            transition: opacity 1.2s ease-out, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), filter 1.2s ease-out;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
        }

        /* Stato attivo per l'immagine */
        #main-container.show {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0px);
        }

        /* Block Testo */
        .text-block {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-out 0.6s, transform 1s ease-out 0.6s;
            z-index: 2;
        }

        /* Stato attivo per il testo */
        #main-container.show .text-block {
            opacity: 1;
            transform: translateY(0);
        }

        /* Titolo principale */
        .text-block h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* Sottotitolo */
        .text-block p {
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #d1d1d1;
        }

        /* Adattamenti per Mobile */
        @media (max-width: 768px) {
            #main-container {
                padding-bottom: 50px;
            }
            .text-block h1 {
                font-size: 1.4rem;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }
            .text-block p {
                font-size: 0.75rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- Container Video -->
    <div id="video-container">
        <video id="intro-video" autoplay muted playsinline>
            <source src="firma.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>
    </div>

    <!-- Container Immagine di Sfondo e Testi -->
    <div id="main-container">
        <div class="text-block">
            <h1>GIOVANNI MENERELLA</h1>
            <p>FOTOGRAFIA &amp; VISUAL</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoContainer = document.getElementById("video-container");
            const video = document.getElementById("intro-video");
            const mainContainer = document.getElementById("main-container");

            // Riconoscimento del dispositivo e impostazione dell'immagine di sfondo
            const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const bgImage = isMobile ? '01 mobile.jpg' : '01 desktop.jpg';
            
            // Precaricamento dell'immagine di sfondo
            mainContainer.style.backgroundImage = `url('${bgImage}')`;

            // Funzione eseguita alla fine del video
            function onVideoEnd() {
                // Sfumatura in uscita del video
                videoContainer.style.opacity = '0';
                
                setTimeout(() => {
                    videoContainer.style.display = 'none';
                    // Attivazione animazione immagine + testo
                    mainContainer.classList.add('show');
                }, 800);
            }

            // Evento di fine video
            video.addEventListener("ended", onVideoEnd);

            // Fallback nel caso in cui l'autoplay venga bloccato o ci siano problemi di riproduzione
            video.play().catch(error => {
                console.log("Autoplay non consentito o errore video:", error);
                onVideoEnd();
            });
        });
    </script>
</body>
</html>
