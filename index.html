<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giovanni Menerella - Fotografia & Visual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            background-color: #000;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Container per il Video */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 30;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }

        video {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Sezione Principale (Hero) */
        #hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* Layer dedicato esclusivamente allo sfondo nero + immagine con transizione */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: blur(15px);
            transition: opacity 1.2s ease-out, filter 1.2s ease-out;
            will-change: opacity, filter;
        }

        /* Container per il Contenuto (Parallasse e Testo) */
        #main-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            transform: translate3d(0, 30px, 0);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            will-change: transform;
        }

        /* Attivazione animazioni della Hero */
        #hero-section.show .bg-layer {
            opacity: 1;
            filter: blur(0px);
        }

        #hero-section.show #main-container {
            transform: translate3d(0, 0, 0);
        }

        .text-block {
            text-align: center;
            opacity: 0;
            transform: translate3d(0, 20px, 0);
            transition: opacity 1s ease-out 0.6s, transform 1s ease-out 0.6s;
            z-index: 2;
            will-change: transform;
        }

        #hero-section.show .text-block {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .text-block h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .text-block p {
            font-size: 1.15rem;
            font-weight: 300;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: #d1d1d1;
        }

        /* Seconda Sezione a sfondo bianco */
        #second-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            box-shadow: 0 -20px 40px rgba(0, 0, 0, 0.3);
        }

        .second-content {
            opacity: 0;
            transform: translate3d(0, 40px, 0);
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: opacity, transform;
        }

        .second-content.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .second-content h2 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 4px;
            line-height: 1.8;
            text-transform: uppercase;
        }

        /* Adattamenti per Mobile */
        @media (max-width: 768px) {
            #video-container {
                display: flex;
            }
            video {
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
                object-fit: cover;
            }
            #main-container {
                padding-bottom: 50px;
            }
            .text-block h1 {
                font-size: 1.4rem;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }
            .text-block p {
                font-size: 0.92rem;
                letter-spacing: 5px;
            }
            .second-content h2 {
                font-size: 1.25rem;
                letter-spacing: 2.5px;
                line-height: 1.7;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Container Video -->
    <div id="video-container">
        <video id="intro-video" autoplay muted playsinline>
            <source src="firma.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>
    </div>

    <!-- Sezione 1: Hero -->
    <section id="hero-section">
        <div class="bg-layer" id="bg-layer"></div>
        <div id="main-container">
            <div class="text-block">
                <h1>GIOVANNI MENERELLA</h1>
                <p>FOTOGRAFIA &amp; VISUAL</p>
            </div>
        </div>
    </section>

    <!-- Sezione 2: Sfondo bianco -->
    <section id="second-section">
        <div class="second-content">
            <h2>GUIDO L'IMMAGINE<br>DALLO SCATTO REALE<br>ALLA SUA FORMA FINALE</h2>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoContainer = document.getElementById("video-container");
            const video = document.getElementById("intro-video");
            const heroSection = document.getElementById("hero-section");
            const bgLayer = document.getElementById("bg-layer");
            const mainContainer = document.getElementById("main-container");
            const textBlock = document.querySelector(".text-block");
            const secondSection = document.getElementById("second-section");
            const secondContent = document.querySelector(".second-content");

            // Riconoscimento dispositivo e caricamento immagine corretta
            const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const bgImage = isMobile ? '01 mobile.jpg' : '01 desktop.jpg';
            bgLayer.style.backgroundImage = `url('${bgImage}')`;

            function onVideoEnd() {
                videoContainer.style.opacity = '0';
                setTimeout(() => {
                    videoContainer.style.display = 'none';
                    heroSection.classList.add('show');
                }, 800);
            }

            video.addEventListener("ended", onVideoEnd);

            video.play().catch(error => {
                console.log("Autoplay non consentito o errore video:", error);
                onVideoEnd();
            });

            // Gestione ottimizzata del parallasse senza tremolii alla fine
            let ticking = false;

            window.addEventListener("scroll", function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        const scrollY = window.scrollY;
                        const windowHeight = window.innerHeight;

                        if (scrollY <= windowHeight) {
                            const currentScroll = Math.min(scrollY, windowHeight);
                            mainContainer.style.transform = `translate3d(0, ${currentScroll * 0.4}px, 0)`;
                            textBlock.style.transform = `translate3d(0, ${currentScroll * 0.2}px, 0)`;
                        }

                        // Attivazione dissolvenza seconda sezione
                        const secondSectionTop = secondSection.getBoundingClientRect().top;
                        if (secondSectionTop < windowHeight * 0.75) {
                            secondContent.classList.add("visible");
                        }

                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
