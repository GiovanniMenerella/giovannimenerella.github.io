<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giovanni Menerella - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* SCHERMATA INTRO BIANCA */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), filter 1s ease;
        }

        #loader.exit {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        .loader-inner {
            text-align: center;
        }

        .name {
            color: #000000;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0;
            transform: translateY(12px);
            filter: blur(6px);
            animation: nameIn 1.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .role {
            color: rgba(0, 0, 0, 0.6);
            font-size: 1.2rem;
            letter-spacing: 8px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px);
            animation: roleIn 1.5s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes nameIn {
            0% { opacity: 0; transform: translateY(12px); filter: blur(6px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes roleIn {
            0% { opacity: 0; transform: translateY(10px); letter-spacing: 2px; }
            100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
        }

        /* TRACK SLIDER DESKTOP */
        #pdf-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #000;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .page-box {
            position: relative;
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* ANIMAZIONE ZOOM E SALITA SULLA PRIMA PAGINA */
        .page-box:first-child canvas {
            opacity: 0;
            transform: translateY(140px) scale(1.12);
            filter: blur(5px);
            transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.5s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1.2s ease;
        }

        .page-box:first-child.animate-in canvas {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.9);
            object-fit: contain;
        }

        .annotationLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .annotationLayer a {
            position: absolute;
            pointer-events: auto;
            color: transparent;
        }

        /* PULSANTI E INTERFACCIA */
        .ui-btn {
            position: fixed;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s, opacity 0.3s;
            user-select: none;
        }

        .ui-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }

        .nav-btn {
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            font-size: 22px;
        }

        .nav-btn:hover {
            transform: translateY(-50%) scale(1.08);
        }

        .nav-btn.disabled {
            opacity: 0.15;
            cursor: default;
            pointer-events: none;
        }

        #prev-btn { left: 25px; }
        #next-btn { right: 25px; }

        #fullscreen-btn {
            top: 25px;
            right: 25px;
            width: 44px;
            height: 44px;
            font-size: 18px;
        }

        #page-counter {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 1000;
            pointer-events: none;
        }

        /* RESPONSIVE SMARTPHONE */
        @media (max-width: 768px) {
            body, html {
                overflow-x: hidden;
                overflow-y: auto;
            }

            #pdf-container {
                display: block;
                width: 100%;
                height: auto;
                transform: none !important;
            }

            .page-box {
                width: 100%;
                height: auto;
                padding: 0;
                margin-bottom: 10px;
            }

            canvas {
                width: 100%;
                height: auto;
                max-height: none;
            }

            .ui-btn, #page-counter {
                display: none;
            }

            .name { font-size: 1.6rem; letter-spacing: 2px; }
            .role { font-size: 1rem; letter-spacing: 4px; }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-inner">
            <h1 class="name">GIOVANNI MENERELLA</h1>
            <p class="role">PORTFOLIO</p>
        </div>
    </div>

    <!-- Controlli Desktop -->
    <button id="fullscreen-btn" class="ui-btn" title="Schermo Intero">&#x26F6;</button>
    <button id="prev-btn" class="ui-btn nav-btn" aria-label="Pagina precedente">&#10094;</button>
    <button id="next-btn" class="ui-btn nav-btn" aria-label="Pagina successiva">&#10095;</button>
    <div id="page-counter">1 / --</div>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");
        const loader = document.getElementById("loader");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const fullscreenBtn = document.getElementById("fullscreen-btn");
        const pageCounter = document.getElementById("page-counter");

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const pdfUrl = isMobile ? "mobile.pdf" : "desktop.pdf";
        const scale = isMobile ? 1.2 : 2.0;

        let currentPage = 1;
        let totalPages = 0;

        function updateNavigation() {
            if (isMobile) return;
            
            container.style.transform = `translateX(-${(currentPage - 1) * 100}vw)`;
            pageCounter.textContent = `${currentPage} / ${totalPages}`;

            prevBtn.classList.toggle("disabled", currentPage === 1);
            nextBtn.classList.toggle("disabled", currentPage === totalPages);
        }

        pdfjsLib.getDocument(pdfUrl).promise.then(async pdf => {
            totalPages = pdf.numPages;
            pageCounter.textContent = `1 / ${totalPages}`;

            for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
                const pageBox = document.createElement("div");
                pageBox.className = "page-box";
                pageBox.id = "page-box-" + pageNumber;
                container.appendChild(pageBox);
            }

            // Render Prima Pagina
            const firstPage = await pdf.getPage(1);
            const firstViewport = firstPage.getViewport({ scale });
            const firstBox = document.getElementById("page-box-1");
            const firstCanvas = document.createElement("canvas");
            const firstContext = firstCanvas.getContext("2d");
            
            firstCanvas.height = firstViewport.height;
            firstCanvas.width = firstViewport.width;
            firstBox.appendChild(firstCanvas);
            
            await firstPage.render({
                canvasContext: firstContext,
                viewport: firstViewport
            }).promise;

            // Trigger Uscita Loader ed Effetto Zoom/Salita Prima Pagina
            setTimeout(() => {
                loader.classList.add("exit");

                setTimeout(() => {
                    firstBox.classList.add("animate-in");
                }, 150);

                setTimeout(() => loader.remove(), 1000);
            }, 1000);

            // Render Pagine Successive
            for (let pageNumber = 2; pageNumber <= totalPages; pageNumber++) {
                const page = await pdf.getPage(pageNumber);
                const viewport = page.getViewport({ scale });
                const pageBox = document.getElementById("page-box-" + pageNumber);
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                pageBox.appendChild(canvas);
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                // Gestione link
                const annotations = await page.getAnnotations();
                if (annotations.length > 0) {
                    const layer = document.createElement("div");
                    layer.className = "annotationLayer";
                    pageBox.appendChild(layer);

                    annotations.forEach(annotation => {
                        if (annotation.subtype === 'Link' && annotation.url) {
                            const link = document.createElement('a');
                            link.href = annotation.url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';

                            const rect = viewport.convertToViewportRectangle(annotation.rect);
                            const left = Math.min(rect[0], rect[2]);
                            const top = Math.min(rect[1], rect[3]);
                            const width = Math.abs(rect[0] - rect[2]);
                            const height = Math.abs(rect[1] - rect[3]);

                            link.style.left = (left / viewport.width * 100) + '%';
                            link.style.top = ((viewport.height - top) / viewport.height * 100) + '%';
                            link.style.width = (width / viewport.width * 100) + '%';
                            link.style.height = (height / viewport.height * 100) + '%';

                            layer.appendChild(link);
                        }
                    });
                }
            }
        }).catch(err => {
            console.error("Errore nel caricamento del PDF: ", err);
        });

        // NAVIGAZIONE PAGINE
        function goToNextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updateNavigation();
            }
        }

        function goToPrevPage() {
            if (currentPage > 1) {
                currentPage--;
                updateNavigation();
            }
        }

        nextBtn.addEventListener("click", goToNextPage);
        prevBtn.addEventListener("click", goToPrevPage);

        // FRECCE TASTIERA
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key === " ") {
                goToNextPage();
            } else if (e.key === "ArrowLeft") {
                goToPrevPage();
            }
        });

        // ROTELLINA DEL MOUSE
        let isScrolling = false;
        window.addEventListener("wheel", (e) => {
            if (isMobile || isScrolling) return;

            if (e.deltaY > 0) {
                goToNextPage();
            } else if (e.deltaY < 0) {
                goToPrevPage();
            }

            isScrolling = true;
            setTimeout(() => { isScrolling = false; }, 400);
        });

        // FULLSCREEN
        fullscreenBtn.addEventListener("click", () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Errore attivazione Fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
