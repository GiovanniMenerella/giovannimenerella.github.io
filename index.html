<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giovanni Menerella - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* SCHERMATA INTRO BIANCA */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), filter 1s ease;
        }

        #loader.exit {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        .loader-inner {
            text-align: center;
        }

        .name {
            color: #000000;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0;
            transform: translateY(12px);
            filter: blur(6px);
            animation: nameIn 1.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .role {
            color: rgba(0, 0, 0, 0.6);
            font-size: 1.2rem;
            letter-spacing: 8px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px);
            animation: roleIn 1.5s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes nameIn {
            0% { opacity: 0; transform: translateY(12px); filter: blur(6px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes roleIn {
            0% { opacity: 0; transform: translateY(10px); letter-spacing: 2px; }
            100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
        }

        /* CONTENITORE PDF PER DESKTOP (ORIZZONTALE) */
        #pdf-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            background: #000;
            align-items: center;
        }

        /* NASCONDE LA BARRA DI SCORRIMENTO */
        #pdf-container::-webkit-scrollbar {
            display: none;
        }
        #pdf-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .page-box {
            position: relative;
            flex: 0 0 auto;
            height: 92vh;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-box:first-child {
            margin-left: 40px;
        }

        .page-box:last-child {
            margin-right: 40px;
        }

        canvas {
            display: block;
            height: 100%;
            width: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .annotationLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .annotationLayer a {
            position: absolute;
            pointer-events: auto;
            color: transparent;
        }

        /* PULSANTI DI NAVIGAZIONE ORIZZONTALE */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: background 0.3s, transform 0.2s, opacity 0.3s;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-50%) scale(1.08);
        }

        #prev-btn { left: 25px; }
        #next-btn { right: 25px; }

        /* IMPAGINAZIONE MOBILE (RIPRISTINA LO SCORRIMENTO VERTICALE SU SMARTPHONE) */
        @media (max-width: 768px) {
            body, html {
                overflow-x: hidden;
                overflow-y: auto;
            }

            #pdf-container {
                display: block;
                width: 100%;
                height: auto;
                overflow: visible;
                padding: 5px;
            }

            .page-box {
                width: 100%;
                height: auto;
                margin: 0 0 10px 0 !important;
            }

            canvas {
                width: 100%;
                height: auto;
            }

            .nav-btn {
                display: none; /* Nasconde i pulsanti su smartphone dove si usa il touch */
            }

            .name { font-size: 1.6rem; letter-spacing: 2px; }
            .role { font-size: 1rem; letter-spacing: 4px; }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-inner">
            <h1 class="name">GIOVANNI MENERELLA</h1>
            <p class="role">PORTFOLIO</p>
        </div>
    </div>

    <!-- Pulsanti di navigazione orizzontale -->
    <button id="prev-btn" class="nav-btn" aria-label="Pagina precedente">&#10094;</button>
    <button id="next-btn" class="nav-btn" aria-label="Pagina successiva">&#10095;</button>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");
        const loader = document.getElementById("loader");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const pdfUrl = isMobile ? "mobile.pdf" : "desktop.pdf";
        const scale = isMobile ? 1.2 : 1.8;

        pdfjsLib.getDocument(pdfUrl).promise.then(async pdf => {
            
            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                const pageBox = document.createElement("div");
                pageBox.className = "page-box";
                pageBox.id = "page-box-" + pageNumber;
                container.appendChild(pageBox);
            }

            // Rendering sequenziale delle pagine
            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                const page = await pdf.getPage(pageNumber);
                const viewport = page.getViewport({ scale });
                const pageBox = document.getElementById("page-box-" + pageNumber);
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                pageBox.appendChild(canvas);
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                // Gestione link per l'ultima pagina
                const annotations = await page.getAnnotations();
                if (annotations.length > 0) {
                    const layer = document.createElement("div");
                    layer.className = "annotationLayer";
                    pageBox.appendChild(layer);

                    annotations.forEach(annotation => {
                        if (annotation.subtype === 'Link' && annotation.url) {
                            const link = document.createElement('a');
                            link.href = annotation.url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';

                            const rect = viewport.convertToViewportRectangle(annotation.rect);
                            const left = Math.min(rect[0], rect[2]);
                            const top = Math.min(rect[1], rect[3]);
                            const width = Math.abs(rect[0] - rect[2]);
                            const height = Math.abs(rect[1] - rect[3]);

                            link.style.left = (left / viewport.width * 100) + '%';
                            link.style.top = ((viewport.height - top) / viewport.height * 100) + '%';
                            link.style.width = (width / viewport.width * 100) + '%';
                            link.style.height = (height / viewport.height * 100) + '%';

                            layer.appendChild(link);
                        }
                    });
                }

                // Rimuovi lo schermo iniziale dopo il caricamento della prima pagina
                if (pageNumber === 1) {
                    setTimeout(() => {
                        loader.classList.add("exit");
                        setTimeout(() => loader.remove(), 1000);
                    }, 1000);
                }
            }
        }).catch(err => {
            console.error("Errore nel caricamento del PDF: ", err);
        });

        // GESTIONE CONTROLLI E SCORRIMENTO ORIZZONTALE
        const scrollAmount = () => window.innerWidth * 0.75; // Distanza di scorrimento ad ogni click

        nextBtn.addEventListener("click", () => {
            container.scrollBy({ left: scrollAmount(), behavior: "smooth" });
        });

        prevBtn.addEventListener("click", () => {
            container.scrollBy({ left: -scrollAmount(), behavior: "smooth" });
        });

        // Navigazione da tastiera tramite freccia Destra e Sinistra
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") {
                container.scrollBy({ left: scrollAmount(), behavior: "smooth" });
            } else if (e.key === "ArrowLeft") {
                container.scrollBy({ left: -scrollAmount(), behavior: "smooth" });
            }
        });

        // Trasforma il movimento della rotellina del mouse verticale in scorrimento orizzontale su PC
        container.addEventListener("wheel", (e) => {
            if (!isMobile && e.deltaY !== 0) {
                e.preventDefault();
                container.scrollBy({ left: e.deltaY * 2.5, behavior: "auto" });
            }
        }, { passive: false });
    </script>
</body>
</html>
