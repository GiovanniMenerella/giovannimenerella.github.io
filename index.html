<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giovanni Menerella - Fotografia & Visual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        /* Container Video Intro */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }

        video {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* PAGINA 1 */
        #page-1 {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Parallasse nativo ultranitido per Desktop */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            opacity: 0;
            filter: blur(15px);
            transition: opacity 1.2s ease-out, filter 1.2s ease-out;
        }

        #page-1.show {
            opacity: 1;
            filter: blur(0px);
        }

        .text-block-1 {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-out 0.4s, transform 1s ease-out 0.4s;
            z-index: 2;
        }

        #page-1.show .text-block-1 {
            opacity: 1;
            transform: translateY(0);
        }

        .text-block-1 h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .text-block-1 p {
            font-size: 1.15rem;
            font-weight: 300;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: #d1d1d1;
        }

        /* PAGINA 2 (Scorre sopra la pagina 1 come una scheda elegante) */
        #page-2 {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 -20px 40px rgba(0, 0, 0, 0.8); /* Ombra stile scheda Apple */
        }

        .text-block-2 {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #page-2.in-view .text-block-2 {
            opacity: 1;
            transform: translateY(0);
        }

        .text-block-2 h2 {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 5px;
            line-height: 1.8;
            text-transform: uppercase;
            color: #1a1a1a;
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            video {
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
                object-fit: cover;
            }
            #page-1 {
                background-attachment: scroll; /* Su mobile l'attachment fixed causa bug grafici, usiamo lo scroll pulito */
                padding-bottom: 50px;
            }
            .text-block-1 h1 {
                font-size: 1.4rem;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }
            .text-block-1 p {
                font-size: 0.92rem;
                letter-spacing: 5px;
            }
            .text-block-2 h2 {
                font-size: 1.15rem;
                letter-spacing: 3px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Video Intro -->
    <div id="video-container">
        <video id="intro-video" autoplay muted playsinline>
            <source src="firma.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>
    </div>

    <!-- Pagina 1 -->
    <section id="page-1">
        <div class="text-block-1">
            <h1>GIOVANNI MENERELLA</h1>
            <p>FOTOGRAFIA &amp; VISUAL</p>
        </div>
    </section>

    <!-- Pagina 2 -->
    <section id="page-2">
        <div class="text-block-2">
            <h2>
                GUIDO L'IMMAGINE<br>
                DALLO SCATTO REALE<br>
                ALLA SUA FORMA FINALE
            </h2>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoContainer = document.getElementById("video-container");
            const video = document.getElementById("intro-video");
            const page1 = document.getElementById("page-1");
            const page2 = document.getElementById("page-2");

            const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const bgImage = isMobile ? '01 mobile.jpg' : '01 desktop.jpg';
            page1.style.backgroundImage = `url('${bgImage}')`;

            function onVideoEnd() {
                videoContainer.style.opacity = '0';
                setTimeout(() => {
                    videoContainer.style.display = 'none';
                    page1.classList.add('show');
                }, 800);
            }

            video.addEventListener("ended", onVideoEnd);
            video.play().catch(error => {
                onVideoEnd();
            });

            // Animazione di comparsa pulita per la seconda pagina
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        page2.classList.add('in-view');
                    }
                });
            }, {
                threshold: 0.25
            });

            observer.observe(page2);
        });
    </script>
</body>
</html>
